name: Test custom notice title and body
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          ci: |
            echo "Building project"
            echo "Tests passed"
          notice-title: "Custom CI Notice Title"
          notice-body: "Custom CI Notice Body"
      - name: Assert result output is success
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if [ -z "$RESULT" ]; then
            echo "FAIL: expected result output to be non-empty"
            exit 1
          fi
          if [ "$RESULT" != "success" ]; then
            echo "FAIL: expected result to be 'success', got '$RESULT'"
            exit 1
          fi
          echo "PASS: result=$RESULT"
