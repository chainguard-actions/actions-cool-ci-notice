name: Test custom notice title and body
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          ci: |
            echo "running CI with custom notice settings"
          notice-title: "Custom CI Notice Title"
          notice-body: "Custom CI Notice Body for testing"
      - name: Assert result output is set
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected result output to be set"
            exit 1
          fi
          echo "PASS: result output is set to: $ACTUAL"
      - name: Assert result indicates success
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          LOWER="$(echo "$ACTUAL" | tr '[:upper:]' '[:lower:]')"
          if echo "$LOWER" | grep -qE 'pass|success|true|ok'; then
            echo "PASS: result indicates success with custom notice inputs"
          else
            echo "FAIL: expected success result but got: $ACTUAL"
            exit 1
          fi
