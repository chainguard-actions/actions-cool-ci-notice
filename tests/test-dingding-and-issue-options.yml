name: Test dingding token and issue options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          ci: |
            echo "CI step running"
          notice-types: dingding
          dingding-token: "fake-dingding-token-for-testing"
          notice-title: "CI Failure Alert"
          notice-body: "Automated CI failure notification body."
          issue-labels: "bug,ci-failure"
          issue-assignees: "octocat"
        continue-on-error: true
      - name: Assert result output exists
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if [ -z "$RESULT" ]; then
            echo "WARN: result output is empty, but action ran"
          else
            echo "PASS: result=$RESULT"
          fi
