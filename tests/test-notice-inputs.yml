name: Test notice title and body inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          ci: echo "Running CI with notice inputs"
          notice-title: "CI Notice Test"
          notice-body: "This is a test notice body"
      - name: Assert result is success
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "success" ]; then
            echo "FAIL: expected result to be 'success', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: action ran successfully with notice inputs"
