name: Test basic CI success
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          ci: echo hello
      - name: Assert result is success
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if [ "$RESULT" != "success" ]; then
            echo "FAIL: expected result='success' but got '$RESULT'"
            exit 1
          fi
          echo "PASS: result='$RESULT'"
