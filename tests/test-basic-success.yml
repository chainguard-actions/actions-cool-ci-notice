name: Test basic CI success
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          ci: "node --version"
      - name: Assert result output is set
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected result output to be non-empty"
            exit 1
          fi
          echo "PASS: result output is '$ACTUAL'"
      - name: Assert result indicates success
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "success" ]; then
            echo "FAIL: expected 'success' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: result is 'success'"
