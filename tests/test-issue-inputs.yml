name: Test issue-labels and issue-assignees inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          ci: |
            echo "hello world"
          notice-types: 'issue'
          issue-labels: 'bug,ci-failure'
          issue-assignees: 'github-actions[bot]'
          notice-title: 'CI Failure Notice'
          notice-body: 'CI has failed, please check the logs.'
        continue-on-error: true
      - name: Assert result output is set
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if [ -z "$RESULT" ]; then
            echo "FAIL: expected result output to be set"
            exit 1
          fi
          echo "PASS: result output is set to '$RESULT'"
